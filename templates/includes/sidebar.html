{% load i18n navigation %}
<!-- Sidebar -->
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

  <!-- Sidebar - Brand -->
  <a class="sidebar-brand d-flex align-items-center justify-content-center" href="{% url 'core:home' %}">
    <div class="sidebar-brand-icon rotate-n-15">
      <i class="{{ brand_icon }}"></i>
    </div>
    <div class="sidebar-brand-text mx-3">{{ business_name }}</div>
  </a>

  <!-- Divider -->
  <hr class="sidebar-divider my-0">

  {% sidebar_menu %}

  <!-- Divider -->
  <hr class="sidebar-divider d-none d-md-block">

  <!-- Sidebar Toggler (Sidebar) -->
  <div class="text-center d-none d-md-inline">
    <button class="rounded-circle border-0" id="sidebarToggle" type="button" aria-label="{% translate 'Contraer o expandir el menú' %}"></button>
  </div>

</ul>
<!-- End of Sidebar -->
