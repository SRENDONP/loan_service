{% load i18n %}
<!-- Logout Modal-->
{# Por ahora cierra la sesión con la vista del admin. La spec de autenticación cambia solo la URL. #}
<div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">{% translate "¿Quieres salir?" %}</h5>
        <button class="close" type="button" data-dismiss="modal" aria-label="{% translate 'Cerrar' %}">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal-body">{% translate "Selecciona «Cerrar sesión» si quieres terminar tu sesión actual." %}</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-dismiss="modal">{% translate "Cancelar" %}</button>
        <form method="post" action="{% url 'admin:logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-primary" type="submit">{% translate "Cerrar sesión" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
